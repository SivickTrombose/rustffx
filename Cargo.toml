[workspace]
resolver = "3"
members = ["crates/*", "demo", "rustffx"]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["SivickTrombose Wizard <rodrosgalinha@gmail.com>"]
description = "Ecossistema feito do zero, construido em cima do winit e inspirado no JavaFX."
license = "GNU General Public License v3.0 (GPLv3)"
readme = "README.md"
rust-version = "1.85.0"

[workspace.dependencies]
winit = { version = "0.30.13", features = ["rwh_06"] }
wgpu = { version = "30.0.1" }
pollster = "1.0.1"
image = "0.25.10"
log = "0.4.35"
env_logger = "0.11.11"
parking_lot = "0.13.0"
